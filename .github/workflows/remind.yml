name: Slack Reminder Bot

on:
  schedule:
    # Jalan setiap hari jam 09:00 WIB (02:00 UTC)
    # Ubah angka jam sesuai kebutuhan. Format cron: menit jam * * *
    - cron: "0 2 * * *"
  workflow_dispatch: {}   # supaya bisa dijalankan manual dari tab Actions untuk testing

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reminder bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_IDS: ${{ secrets.SLACK_CHANNEL_IDS }}
          NEW_EYES_MENTION_USER_ID: ${{ secrets.NEW_EYES_MENTION_USER_ID }}
          NEW_CHECK_MENTION_USER_ID: ${{ secrets.NEW_CHECK_MENTION_USER_ID }}
          REMINDER_MENTION_GROUP_ID: ${{ secrets.REMINDER_MENTION_GROUP_ID }}
          # Override window buat testing (kosongkan/hapus secretnya untuk pakai default lagi)
          NEW_EYES_WINDOW_DAYS: ${{ secrets.NEW_EYES_WINDOW_DAYS }}
          NEW_CHECK_WINDOW_DAYS: ${{ secrets.NEW_CHECK_WINDOW_DAYS }}
          URGENT_WINDOW_DAYS: ${{ secrets.URGENT_WINDOW_DAYS }}
        run: python reminder_bot.py
